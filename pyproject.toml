[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "password-validator-python"
version = "1.2.0"
description = "Mini-projeto em Python para validar senhas via CLI com foco em segurança, testes e especificação de requisitos."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Bruno Moterani Meri" }
]
license = { text = "MIT" }
keywords = ["python", "password", "validator", "cli", "pytest", "requirements"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
password-validator = "password_validator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
